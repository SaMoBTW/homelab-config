apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-deployment
  namespace: zurg
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      nodeSelector:
        workload-strength: ram-heavy
      initContainers:
        # Pin Plex settings from git: pms-docker only applies a few env vars on
        # its first run, so write preferences.env (configMapGenerator below) into
        # Preferences.xml before every start. Edits keep the file's owner.
        - name: pin-preferences
          image: docker.io/library/alpine:3.19
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              P="/config/Library/Application Support/Plex Media Server/Preferences.xml"
              [ -f "$P" ] || { echo "no Preferences.xml yet - Plex first run"; exit 0; }
              T=/tmp/prefs.xml; cp "$P" "$T"
              while IFS='=' read -r k v; do
                case "$k" in ''|'#'*) continue;; esac
                if grep -q " $k=\"" "$T"; then
                  sed -i "s| $k=\"[^\"]*\"| $k=\"$v\"|" "$T"
                else
                  sed -i "s|/>[[:space:]]*\$| $k=\"$v\"/>|" "$T"
                fi
                echo "set $k=$v"
              done < /prefs/preferences.env
              cat "$T" > "$P"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: preferences
              mountPath: /prefs
      containers:
        - name: plex-container
          image: plexinc/pms-docker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - containerPort: 32400
          startupProbe:
            httpGet: { path: /identity, port: 32400 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /identity, port: 32400 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /identity, port: 32400 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          env:
            - name: TZ
              value: "America/New_York"
            - name: ADVERTISE_IP
              value: "http://plex.100.119.68.88.nip.io:30400/,http://plex.100.119.68.88.nip.io:80/"
          envFrom:
            - secretRef:
                name: plex-claim
                optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              
            - name: cache
              mountPath: /transcode
              
            - name: zurg-mount
              mountPath: /zurg-mount
              mountPropagation: HostToContainer

            - name: dri
              mountPath: /dev/dri
              
      volumes:
        - name: preferences
          configMap:
            name: plex-preferences

        - name: config
          hostPath:
            path: /volume1/k3s/media/plex/config
            type: DirectoryOrCreate
                
        - name: cache
          hostPath:
            path: /volume1/k3s/media/plex/cache
            type: DirectoryOrCreate
                
        - name: zurg-mount
          hostPath:
            path: /volume1/k3s/media/mnt

        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
