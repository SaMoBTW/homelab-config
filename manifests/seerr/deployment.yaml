apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr-deployment
  namespace: zurg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        workload-strength: ram-heavy
      containers:
        - name: seerr-container
          image: ghcr.io/seerr-team/seerr:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5055
          env:
            - name: TZ
              value: "America/New_York"
          startupProbe:
            httpGet: { path: /api/v1/settings/public, port: 5055 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/settings/public, port: 5055 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-pvc
