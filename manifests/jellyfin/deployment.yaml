apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-deployment
  namespace: zurg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        workload-strength: ram-heavy
      initContainers:
        # Abyss Spotlight: copy the web client, add the add-on, inject its loader.
        # Same image as the main container, so the web files always match. See spotlight/README.md.
        - name: abyss-spotlight
          image: jellyfin/jellyfin:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -a /jellyfin/jellyfin-web/. /abyss-web/
              mkdir -p /abyss-web/ui
              cp /spotlight/spotlight.html /spotlight/spotlight.css /spotlight/spotlight-loader.js /abyss-web/ui/
              grep -q data-abyss-spotlight /abyss-web/index.html || \
                sed -i 's#</body>#<script src="ui/spotlight-loader.js" data-abyss-spotlight></script></body>#' /abyss-web/index.html
              grep -q data-abyss-spotlight /abyss-web/index.html
          volumeMounts:
            - name: abyss-web
              mountPath: /abyss-web
            - name: abyss-spotlight
              mountPath: /spotlight
      containers:
        - name: jellyfin-container
          image: jellyfin/jellyfin:latest
          imagePullPolicy: IfNotPresent
          # Intel Quick Sync (i3-1315U iGPU) for transcoding - encoding.xml is set
          # to qsv on /dev/dri/renderD128, but without the device every transcode
          # fell back to the CPU. Same approach as manifests/plex (approved by Samir).
          securityContext:
            privileged: true
          env:
            # ffprobe reads through the zurg mount; Jellyfin's 1G/200M defaults
            # pull far more from Usenet than needed (see media-stack I/O notes).
            - name: JELLYFIN_FFmpeg__probesize
              value: 75M
            - name: JELLYFIN_FFmpeg__analyzeduration
              value: 10M
            # Serve the Spotlight-patched copy of the web client (init container above).
            - name: JELLYFIN_WEB_DIR
              value: /abyss-web
          ports:
            - containerPort: 8096
          startupProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8096 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
              
            - name: cache
              mountPath: /cache
              
            - name: zurg-mount
              mountPath: /zurg-mount
              mountPropagation: HostToContainer

            - name: abyss-web
              mountPath: /abyss-web
              readOnly: true

            - name: dri
              mountPath: /dev/dri

      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory

        - name: abyss-web
          emptyDir:
            sizeLimit: 256Mi

        - name: abyss-spotlight
          configMap:
            name: abyss-spotlight

        - name: config
          hostPath:
            path: /volume1/k3s/media/jellyfin/config
            type: DirectoryOrCreate
                
        - name: cache
          hostPath:
            path: /volume1/k3s/media/jellyfin/cache
            type: DirectoryOrCreate
                
        - name: zurg-mount
          hostPath:
            path: /volume1/k3s/media/mnt