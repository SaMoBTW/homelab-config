apiVersion: v1
kind: Service
metadata:
  name: zurg
  namespace: zurg
  labels:
    app: zurg-service
spec:
  type: NodePort
  selector:
    app: zurg
  ports:
    - name: metrics-port
      port: 9999
      targetPort: 9999
      nodePort: 30099


