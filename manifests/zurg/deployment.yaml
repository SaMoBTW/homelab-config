apiVersion: apps/v1
kind: Deployment
metadata:
  name: zurg-deployment
  namespace: zurg
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zurg
  template:
    metadata:
      labels:
        app: zurg
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      nodeSelector:
        workload-strength: ram-heavy
      containers:
        - name: zurg-container
          image: ghcr.io/debridmediamanager/zurg@sha256:a2ee7903464b76ae7033666f9f140aa862816f3b31bc5134de82a0a5adf4159b  # 2026.11.08.0000-nightly (rex needs 2026.10.27+)
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - containerPort: 9999
          # A first start after an upgrade loads every NZB and migrates release
          # state: 2026.10.24 took over 5 min and was killed once. Allow 15.
          startupProbe:
            httpGet: { path: /http/version.txt, port: 9999 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /http/version.txt, port: 9999 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /http/version.txt, port: 9999 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            - name: mnt
              mountPath: /zurg_mnt
              mountPropagation: Bidirectional
      restartPolicy: Always
      volumes:
        - name: config
          hostPath:
            path: /volume1/k3s/media/zurg
            type: DirectoryOrCreate
        - name: mnt
          hostPath:
            path: /volume1/k3s/media/mnt
            type: DirectoryOrCreate
