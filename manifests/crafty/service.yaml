apiVersion: v1
kind: Service
metadata:
  name: crafty-service
  namespace: crafty
  annotations:
    # Crafty only serves HTTPS (self-signed) on 8443.
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: crafty-crafty-insecure@kubernetescrd
spec:
  type: ClusterIP
  selector:
    app: crafty
  ports:
    - protocol: TCP
      port: 8443
      targetPort: 8443
