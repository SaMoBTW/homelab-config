apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crafty
  namespace: argocd
spec:
    source:
        repoURL: git@github.com:SaMoBTW/homelab-config.git
        path: manifests/crafty
        targetRevision: HEAD
    destination:
        server: https://kubernetes.default.svc
        namespace: crafty
    project: default
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
