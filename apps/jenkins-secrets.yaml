apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-secrets
  namespace: argocd
spec:
    source: 
        repoURL: git@github.com:SaMoBTW/homelab-config.git
        path: manifests/jenkins
        targetRevision: HEAD
    destination:
        server: https://kubernetes.default.svc
        namespace: jenkins
    project: default
    syncPolicy:
        automated:
            prune: true
            selfHeal: true