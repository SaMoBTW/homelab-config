apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zurg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
    source: 
        repoURL: git@github.com:SaMoBTW/homelab-config.git
        path: manifests/zurg
        targetRevision: HEAD
    destination:
        server: https://kubernetes.default.svc
        namespace: zurg
    project: default
    # manual sync until first adoption verified; then add automated prune+selfHeal
